<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar - TTS Bahasa Arab</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-pattern flex-center">
  <div class="card">
    <h2 class="text-center">Pendaftaran Siswa</h2>
    <div id="alert" class="alert hidden"></div>
    <form id="register-form">
      <div class="form-group">
        <label for="full_name">Nama Lengkap</label>
        <input type="text" id="full_name" required placeholder="Ahmad Mujtaba">
      </div>
      <div class="form-group">
        <label for="class_name">Kelas</label>
        <input type="text" id="class_name" required placeholder="10 C">
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="nama@email.com">
      </div>
      <div class="form-group">
        <label for="password">Kata Sandi (Min. 6 Karakter)</label>
        <input type="password" id="password" required minlength="6" placeholder="••••••••">
      </div>
      <button type="submit" id="btn-submit" class="btn btn-primary btn-block">Daftar Akun</button>
    </form>
    <p class="text-center mt-3">Sudah punya akun? <a href="login.html">Masuk di sini</a></p>
  </div>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
